[package]
name = "kafeplat"
version = "1.0.0"
description = "KafePlat - Kafe boshqaruv tizimi"
authors = ["KafePlat"]
edition = "2021"

[lib]
name = "kafeplat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
